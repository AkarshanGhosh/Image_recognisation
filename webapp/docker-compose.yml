

services:
  backend:
    build: ./backend
    container_name: ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: ai-redis
    ports:
      - "6379:6379"

  # Uncomment below to run local MongoDB (if not using Atlas)
